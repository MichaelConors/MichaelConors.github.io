<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnonPay</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #reader {
            width: 100vw;
            height: 100vh;
        }

        /* Убираем стандартные элементы библиотеки */
        #reader__scan_region {
            min-height: 100vh !important;
        }
        #reader__scan_region video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
        }
        #reader__scan_region img {
            display: none !important;
        }
        #reader__dashboard {
            display: none !important;
        }
        #reader__header_message {
            display: none !important;
        }

        /* Затемнение с вырезом */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
        }

        .scan-frame {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            z-index: 11;
            pointer-events: none;
        }

        /* Уголки рамки */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #fff;
            border-style: solid;
        }
        .corner-tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 8px 0 0 0; }
        .corner-tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 8px 0 0; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 8px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 8px 0; }

        .hint {
            position: fixed;
            bottom: 80px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: -apple-system, sans-serif;
            font-size: 16px;
            opacity: 0.8;
            z-index: 12;
        }

        /* Скрываем встроенную рамку библиотеки */
        #reader__scan_region > div:last-child {
            display: none !important;
        }
        #qr-shaded-region {
            display: none !important;
        }
        /* Убираем border у внутренних элементов */
        #reader {
            border: none !important;
        }
        #reader video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
        }
    </style>
</head>
<body>
    <div id="reader"></div>

    <!-- SVG затемнение с вырезом -->
    <svg class="overlay">
        <defs>
            <mask id="hole">
                <rect width="100%" height="100%" fill="white"/>
                <rect x="50%" y="50%" width="250" height="250"
                      transform="translate(-125, -125)"
                      rx="12" ry="12" fill="black"/>
            </mask>
        </defs>
        <rect width="100%" height="100%" fill="rgba(0,0,0,0.6)" mask="url(#hole)"/>
    </svg>

    <!-- Уголки -->
    <div class="scan-frame">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
    </div>

    <div class="hint">Наведите камеру на QR-код</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const scanner = new Html5Qrcode("reader");
        scanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                disableFlip: false
            },
            onScanSuccess,
            onScanFailure
        );

        function onScanSuccess(decoded) {
            scanner.stop();
            tg.sendData(JSON.stringify({ qr_link: decoded }));
        }

        function onScanFailure(error) {
            // тихо игнорим
        }
    </script>
</body>
</html>
