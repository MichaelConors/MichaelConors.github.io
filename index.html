<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnonPay</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            overflow: hidden;
        }

        .top-bar .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .top-bar .username {
            color: #fff;
            font-family: -apple-system, sans-serif;
            font-size: 15px;
            font-weight: 500;
        }

        .top-bar .login-btn {
            color: #fff;
            font-family: -apple-system, sans-serif;
            font-size: 14px;
            background: #3390ec;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
        }

        #reader {
            border: none !important;
            width: 100vw;
            height: 100vh;
        }

        #reader * {
            border: none !important;
        }

        #reader video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
        }

        #reader__scan_region {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            min-height: 100vh !important;
        }

        #reader__scan_region > div,
        #reader__dashboard,
        #reader__header_message,
        #qr-shaded-region {
            display: none !important;
        }

        .blur-top, .blur-bottom, .blur-left, .blur-right {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(0,0,0,0.3);
        }

        .blur-top { top: 0; left: 0; right: 0; height: calc(40vh - 125px); }
        .blur-bottom { bottom: 0; left: 0; right: 0; height: calc(60vh - 125px); }
        .blur-left { top: calc(40vh - 125px); left: 0; width: calc(50vw - 125px); height: 250px; }
        .blur-right { top: calc(40vh - 125px); right: 0; width: calc(50vw - 125px); height: 250px; }

        .scan-frame {
            position: fixed;
            top: 40vh;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            z-index: 11;
            pointer-events: none;
        }

        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #fff;
            border-style: solid;
        }
        .corner-tl { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 8px 0 0 0; }
        .corner-tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 8px 0 0; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 8px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 8px 0; }

        .hint {
            position: fixed;
            bottom: 80px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: -apple-system, sans-serif;
            font-size: 16px;
            opacity: 0.8;
            z-index: 12;
        }
    </style>
</head>
<body>
    <div class="top-bar" id="topBar">
        <!-- Заполняется через JS -->
    </div>

    <div id="reader"></div>

    <div class="blur-top"></div>
    <div class="blur-bottom"></div>
    <div class="blur-left"></div>
    <div class="blur-right"></div>

    <div class="scan-frame">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
    </div>

    <div class="hint">Наведите камеру на QR-код</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const topBar = document.getElementById("topBar");

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            // Зашли через Telegram
            const user = tg.initDataUnsafe.user;
            const name = user.username ? `@${user.username}` : `${user.first_name}`;
            const photoUrl = user.photo_url;

            topBar.innerHTML = `
                <div class="avatar">
                    ${photoUrl ? `<img src="${photoUrl}" alt="">` : name.charAt(0).toUpperCase()}
                </div>
                <span class="username">${name}</span>
            `;

            tg.expand();
            startScanner();
        } else {
            // Зашли через браузер — показываем кнопку логина
            topBar.innerHTML = `
                <span class="username" style="opacity:0.6;">Вы не авторизованы</span>
                <button class="login-btn" id="loginBtn">Войти через Telegram</button>
            `;

            document.getElementById("loginBtn").addEventListener("click", () => {
                // Telegram Login Widget redirect
                window.location.href = "https://t.me/anonnet_paybot?start=login";
            });

            startScanner();
        }

        function startScanner() {
            const scanner = new Html5Qrcode("reader");
            scanner.start(
                { facingMode: "environment" },
                { fps: 10, disableFlip: false },
                onScanSuccess,
                onScanFailure
            );
        }

        function onScanSuccess(decoded) {
            if (!tg.initDataUnsafe || !tg.initDataUnsafe.user) {
                alert("Авторизуйтесь через Telegram для оплаты");
                return;
            }
            tg.sendData(JSON.stringify({ qr_link: decoded }));
        }

        function onScanFailure(error) {}
    </script>
</body>
</html>
